<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dian Jin Shi — Atelier Genèse</title>
  <meta name="description" content="Dian Jin Shi — Logo Design by Atelier Genèse.">

  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz@6..96&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F4F1EA;
      color: #292927;
      font-family: "Montserrat", sans-serif;
    }

    nav {
      width: 100%;
      padding: 32px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand img {
      width: 180px;
      height: auto;
      display: block;
    }

    .menu {
      display: flex;
      gap: 32px;
    }

    .menu a {
      color: #292927;
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3px;
    }

    .hero {
      padding: 1.5% 8% 8%;
    }

    .label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }

    h1 {
      font-family: "Bodoni Moda", serif;
      font-size: clamp(65px, 10vw, 150px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -3px;
    }

    .details {
      margin-top: 55px;
      padding-top: 25px;
      border-top: 1px solid #A69D91;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .detail-title {
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .detail-text {
      font-size: 11px;
      line-height: 1.7;
    }

    .project-image {
      padding: 4% 8% 6%;
    }

    .project-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    .story {
      padding: 6% 8% 10%;
      max-width: 1000px;
    }

    .story h2 {
      font-family: "Bodoni Moda", serif;
      font-size: clamp(38px, 5vw, 70px);
      font-weight: 400;
      line-height: 1.05;
      margin-bottom: 35px;
    }

    .story p {
      max-width: 560px;
      font-size: 12px;
      line-height: 1.9;
    }

    @media (max-width: 700px) {
      nav {
        padding: 24px 6%;
      }

      .brand img {
        width: 145px;
      }

      .menu {
        gap: 14px;
      }

      .menu a {
        font-size: 8px;
        letter-spacing: 1.5px;
      }

      .hero {
        padding: 6% 7% 12%;
      }

      h1 {
        font-size: 17vw;
        letter-spacing: -1px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .project-image {
        padding: 4% 7% 10%;
      }

      .story {
        padding: 12% 7% 16%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="brand">
      <img src="logo.png" alt="Atelier Genèse">
    </a>

    <div class="menu">
      <a href="work.html">WORK</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </div>
  </nav>

  <main>

    <section class="hero">

      <p class="label">LOGO DESIGN — JEWELRY</p>

      <h1>Dian Jin Shi</h1>

      <div class="details">

        <div>
          <p class="detail-title">CLIENT</p>
          <p class="detail-text">Dian Jin Shi</p>
        </div>

        <div>
          <p class="detail-title">SERVICES</p>
          <p class="detail-text">Logo Design</p>
        </div>

      </div>

    </section>

    <section class="project-image">
      <img src="dian-jin-shi-logo.png" alt="Dian Jin Shi Logo">
    </section>

    <section class="story">

      <h2>The Identity.</h2>

      <p>
        A refined logo created for Dian Jin Shi, a jewelry brand,
        with an emphasis on elegance, clarity and a timeless visual presence.
      </p>

    </section>

  </main>

</body>
</html>
