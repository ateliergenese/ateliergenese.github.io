<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Work — Atelier Genèse</title>
  <meta name="description" content="Selected work by Atelier Genèse.">

  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz@6..96&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F4F1EA;
      color: #292927;
      font-family: "Montserrat", sans-serif;
    }

    nav {
      width: 100%;
      padding: 32px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand img {
      width: 180px;
      height: auto;
      display: block;
    }

    .menu {
      display: flex;
      gap: 32px;
    }

    .menu a {
      color: #292927;
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3px;
    }

    .work {
      padding: 1.5% 8% 10%;
    }

    .page-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }

    h1 {
      font-family: "Bodoni Moda", serif;
      font-size: clamp(60px, 9vw, 130px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -3px;
    }

    .intro {
      max-width: 470px;
      margin-top: 40px;
      font-size: 12px;
      line-height: 1.8;
    }

    .intro-cn {
      max-width: 470px;
      margin-top: 12px;
      color: #6F6A63;
      font-size: 10px;
      line-height: 1.9;
    }

    .projects {
      margin-top: 100px;
      border-top: 1px solid #A69D91;
    }

    .project {
      padding: 35px 0;
      border-bottom: 1px solid #A69D91;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #292927;
      text-decoration: none;
      transition: opacity 0.25s ease;
    }

    .project-name {
      font-family: "Bodoni Moda", serif;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 400;
    }

    .project-type {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 3px;
    }

    .project-type-cn {
      margin-top: 7px;
      color: #6F6A63;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .view-project {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 2.5px;
      white-space: nowrap;
      transition: transform 0.25s ease;
    }

    .project:hover {
      opacity: 0.65;
    }

    .project:hover .view-project {
      transform: translateX(5px);
    }

    @media (max-width: 700px) {

      nav {
        padding: 24px 6%;
      }

      .brand img {
        width: 145px;
      }

      .menu {
        gap: 12px;
      }

      .menu a {
        font-size: 7.5px;
        letter-spacing: 1.2px;
      }

      .work {
        padding: 12% 7%;
      }

      h1 {
        font-size: 17vw;
        letter-spacing: -1px;
      }

      .projects {
        margin-top: 70px;
      }

      .project {
        align-items: flex-start;
        gap: 20px;
      }

      .project-type {
        margin-top: 8px;
        line-height: 1.6;
      }

      .project-type-cn {
        font-size: 8px;
      }

      .view-project {
        font-size: 8px;
        letter-spacing: 1.5px;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="brand">
      <img src="logo.png" alt="Atelier Genèse">
    </a>

    <div class="menu">
      <a href="work.html">WORK</a>
      <a href="about.html">ABOUT</a>
      <a href="info.html">INFO</a>
      <a href="contact.html">CONTACT</a>
    </div>

  </nav>


  <main class="work">

    <p class="page-label">
      SELECTED WORK
    </p>

    <h1>
      Projects with<br>
      a Beginning.
    </h1>

    <p class="intro">
      Selected identities and visual work created for brands
      with stories worth building.
    </p>

    <p class="intro-cn">
      精選品牌識別與視覺設計作品，
      為值得被延續的品牌故事打造清晰而有質感的開始。
    </p>


    <div class="projects">

      <a href="dian-jin-shi.html" class="project">

        <div>

          <p class="project-name">
            Dian Jin Shi
          </p>

          <p class="project-type">
            LOGO DESIGN — JEWELRY
          </p>

          <p class="project-type-cn">
            LOGO 設計 — 珠寶
          </p>

        </div>

        <p class="view-project">
          VIEW PROJECT ↗
        </p>

      </a>

    </div>

  </main>

</body>
</html>
